# Railway configuration — PromptSkill backend
#
# The web service runs the release-phase command before starting.
# Worker and beat services share the same repo + env but don't run
# migrations — only web does, to avoid race conditions on multi-
# service deploys.
#
# Nixpacks does NOT auto-match service names to Procfile entries —
# it defaults all services to the `web:` Procfile entry. Set Custom
# Start Commands in Railway dashboard for each service:
#   web:     (leave blank — Nixpacks default picks uvicorn from Procfile)
#   worker:  celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
#   beat:    celery -A app.tasks.celery_app beat --loglevel=info
#
# Migrations: set as pre-deploy command on the web service ONLY
# in Railway dashboard (Settings → Deploy → Add pre-deploy step →
# "alembic upgrade head"). Do NOT use preDeployCommand here — Nixpacks
# runs it at BUILD time without env vars, causing import failures.

[build]
builder = "NIXPACKS"

[deploy]
# Restart policy only — no preDeployCommand (see comment above).
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
